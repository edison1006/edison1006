<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Build the pipeline. Expose the signal.</title>
  <desc id="desc">Edison Zhang is open to data engineering, analytics engineering, and business intelligence opportunities in New Zealand.</desc>
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030008"/>
      <stop offset="0.5" stop-color="#16002e"/>
      <stop offset="1" stop-color="#05010d"/>
    </linearGradient>
    <linearGradient id="footerLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <pattern id="footerGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a855f7" stroke-opacity=".08"/>
    </pattern>
    <filter id="footerGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="1196" height="256" rx="24" fill="url(#footerBg)" stroke="#7c3aed" stroke-width="2"/>
  <rect x="3" y="3" width="1194" height="254" rx="23" fill="url(#footerGrid)"/>
  <path d="M34 50V28h22M1144 28h22v22M34 210v22h22M1144 232h22v-22" fill="none" stroke="#e879f9" stroke-width="3" filter="url(#footerGlow)"/>

  <text x="600" y="91" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="43" letter-spacing="2">
    <tspan fill="#ffffff">BUILD THE PIPELINE.</tspan>
    <tspan fill="#e879f9"> EXPOSE THE SIGNAL.</tspan>
  </text>
  <rect x="130" y="116" width="940" height="3" rx="1.5" fill="url(#footerLine)" filter="url(#footerGlow)"/>

  <g transform="translate(172 144)">
    <rect width="856" height="62" rx="31" fill="#10021f" stroke="#9333ea" stroke-width="2"/>
    <circle cx="39" cy="31" r="9" fill="#22d3ee" filter="url(#footerGlow)"/>
    <text x="64" y="38" fill="#f3e8ff" font-family="Courier New, monospace" font-size="19" font-weight="700" letter-spacing="1.5">OPEN TO DATA ENGINEERING · ANALYTICS ENGINEERING · BI</text>
    <text x="792" y="38" fill="#c084fc" font-family="Courier New, monospace" font-size="15" font-weight="700">NZ</text>
  </g>

  <text x="600" y="238" text-anchor="middle" fill="#8b5cf6" font-family="Courier New, monospace" font-size="11" letter-spacing="4">CONNECTION CHANNEL // ACTIVE</text>
</svg>
