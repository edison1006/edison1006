<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Edison Zhang career and education timeline</title>
  <desc id="desc">Career and education from 2014 to the present, including banking analytics, data engineering, and two master's degrees.</desc>
  <defs>
    <linearGradient id="timelineBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05010d"/>
      <stop offset="0.48" stop-color="#130026"/>
      <stop offset="1" stop-color="#07000f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c084fc" opacity=".12"/>
    </pattern>
    <filter id="timelineGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="1196" height="696" rx="26" fill="url(#timelineBg)" stroke="#6d28d9" stroke-width="2"/>
  <rect x="3" y="3" width="1194" height="694" rx="25" fill="url(#dots)"/>

  <text x="58" y="72" fill="#e879f9" font-family="Courier New, monospace" font-size="16" font-weight="700" letter-spacing="4">05 // CAREER TRANSMISSION</text>
  <text x="58" y="119" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="42" letter-spacing="3">FROM FINANCE TO DATA SYSTEMS</text>
  <text x="1142" y="97" text-anchor="end" fill="#a78bfa" font-family="Courier New, monospace" font-size="15">2014 — PRESENT</text>

  <rect x="175" y="157" width="4" height="466" rx="2" fill="url(#beam)" filter="url(#timelineGlow)"/>

  <g font-family="Courier New, monospace">
    <g transform="translate(0 185)">
      <text x="58" y="8" fill="#22d3ee" font-size="24" font-weight="700">2014</text>
      <circle cx="177" cy="0" r="12" fill="#05010d" stroke="#22d3ee" stroke-width="4" filter="url(#timelineGlow)"/>
      <rect x="216" y="-40" width="926" height="82" rx="13" fill="#0d0820" stroke="#164e63"/>
      <text x="242" y="-7" fill="#ffffff" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" font-weight="700">Double Bachelor Foundation</text>
      <text x="242" y="23" fill="#a5f3fc" font-size="15">COMPUTING &amp; INFORMATION SCIENCE  +  FINANCE</text>
    </g>

    <g transform="translate(0 290)">
      <text x="38" y="8" fill="#8b5cf6" font-size="22" font-weight="700">2018—25</text>
      <circle cx="177" cy="0" r="12" fill="#05010d" stroke="#8b5cf6" stroke-width="4" filter="url(#timelineGlow)"/>
      <rect x="216" y="-40" width="926" height="82" rx="13" fill="#100622" stroke="#6d28d9"/>
      <text x="242" y="-7" fill="#ffffff" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" font-weight="700">Data Analyst</text>
      <text x="242" y="23" fill="#c4b5fd" font-size="15">SHANGHAI PUDONG DEVELOPMENT BANK · CHINA</text>
    </g>

    <g transform="translate(0 395)">
      <text x="58" y="8" fill="#a855f7" font-size="24" font-weight="700">2021</text>
      <circle cx="177" cy="0" r="12" fill="#05010d" stroke="#a855f7" stroke-width="4" filter="url(#timelineGlow)"/>
      <rect x="216" y="-40" width="926" height="82" rx="13" fill="#120525" stroke="#9333ea"/>
      <text x="242" y="-7" fill="#ffffff" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" font-weight="700">Master of Business Administration</text>
      <text x="242" y="23" fill="#d8b4fe" font-size="15">ANHUI UNIVERSITY · CHINA</text>
    </g>

    <g transform="translate(0 500)">
      <text x="38" y="8" fill="#d946ef" font-size="22" font-weight="700">2025—NOW</text>
      <circle cx="177" cy="0" r="12" fill="#05010d" stroke="#d946ef" stroke-width="4" filter="url(#timelineGlow)"/>
      <rect x="216" y="-40" width="926" height="82" rx="13" fill="#160526" stroke="#c026d3"/>
      <text x="242" y="-7" fill="#ffffff" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" font-weight="700">Data Engineer &amp; Analyst</text>
      <text x="242" y="23" fill="#f0abfc" font-size="15">TIAKI TAONGA TRUST · AUCKLAND, NEW ZEALAND</text>
    </g>

    <g transform="translate(0 605)">
      <text x="58" y="8" fill="#e879f9" font-size="24" font-weight="700">2026</text>
      <circle cx="177" cy="0" r="12" fill="#05010d" stroke="#e879f9" stroke-width="4" filter="url(#timelineGlow)"/>
      <rect x="216" y="-40" width="926" height="82" rx="13" fill="#1a0527" stroke="#e879f9"/>
      <text x="242" y="-7" fill="#ffffff" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" font-weight="700">Master of Software Engineering</text>
      <text x="242" y="23" fill="#f5d0fe" font-size="15">YOOBEE COLLEGE · NEW ZEALAND</text>
    </g>
  </g>

  <text x="1142" y="670" text-anchor="end" fill="#7c3aed" font-family="Courier New, monospace" font-size="13" letter-spacing="3">TRANSMISSION CONTINUES //</text>
</svg>
