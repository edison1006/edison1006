<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Edison Zhang pixel profile dashboard</title>
  <desc id="desc">A retro pixel game style GitHub profile dashboard with mountains, forest, panels, repositories, profile stats, and activity blocks.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1d79d3"/>
      <stop offset="0.62" stop-color="#78c9ff"/>
      <stop offset="1" stop-color="#c7f0ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#eef4d4"/>
      <stop offset="1" stop-color="#d7e8bd"/>
    </linearGradient>
    <linearGradient id="path" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8c987"/>
      <stop offset="1" stop-color="#b9844e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#294f35" flood-opacity="0.45"/>
    </filter>
    <style>
      .pixel { shape-rendering: crispEdges; }
      .ui { font-family: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .mono { font-family: "Courier New", "PingFang SC", monospace; font-weight: 700; }
      .dark { fill: #1f2a1f; }
      .muted { fill: #49614a; }
      .cream { fill: #fff2c0; }
      .line { stroke: #315c3d; stroke-width: 4; }
      .thin { stroke: #5e855b; stroke-width: 3; }
      .tiny { font-size: 18px; }
      .small { font-size: 22px; }
      .medium { font-size: 28px; font-weight: 800; }
      .big { font-size: 48px; font-weight: 900; }
    </style>
  </defs>

  <rect class="pixel" width="1400" height="900" fill="#7a3f1c"/>

  <!-- sky and distant scenery -->
  <rect class="pixel" x="0" y="0" width="1400" height="176" fill="url(#sky)"/>
