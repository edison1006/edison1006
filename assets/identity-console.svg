<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Edison Zhang identity console</title>
  <desc id="desc">Data Engineer and Analytics Strategist in Auckland, New Zealand, with banking and analytics experience.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05010d"/>
      <stop offset="0.5" stop-color="#120024"/>
      <stop offset="1" stop-color="#080011"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
